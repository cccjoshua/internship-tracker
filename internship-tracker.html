<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internship Tracker</title>
<meta name="description" content="Track internship applications and rank new listings, locally.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230071E3%27/%3E%3Cpath d=%27M9 17l5 5 9-11%27 stroke=%27%23FFFFFF%27 stroke-width=%273.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="apple.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app" id="app">
  <aside class="rail">
    <div class="brand"><b>Internship Tracker</b><span>Summer 2027 season</span></div>
    <button class="rail-search" type="button" data-action="palette" title="Search applications, listings and pages (⌘K / Ctrl K)"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><span>Search</span><span class="kbd" id="kHint">⌘K</span></button>
    <nav class="nav" aria-label="Views">
      <a href="#dashboard" data-nav="dashboard"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="lbl">Dashboard</span><span class="lbl-s">Home</span><span class="n" id="nDash"></span></a>
      <a href="#board" data-nav="apps" id="navApps"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="3.4" height="11" rx="1"/><rect x="6.3" y="2.5" width="3.4" height="7" rx="1"/><rect x="10.6" y="2.5" width="3.4" height="9" rx="1"/></svg><span class="lbl">Applications</span><span class="lbl-s">Apps</span><span class="n" id="nApps"></span></a>
      <a href="#inbox" data-nav="inbox"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 9.5 4 3h8l2 6.5V13H2z"/><path d="M2 9.5h3.5l1 1.5h3l1-1.5H14"/></svg><span class="lbl">New listings</span><span class="lbl-s">Listings</span><span class="n" id="nInbox"></span></a>
      <a href="#docs" data-nav="docs"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5.2h3.5M6 8.3h4.5M6 10.8h4.5"/></svg><span class="lbl">Documents</span><span class="lbl-s">Docs</span><span class="n" id="nDocs"></span></a>
      <a href="#profile" data-nav="profile"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5.5" r="2.7"/><path d="M2.8 14c.6-2.7 2.7-4.2 5.2-4.2s4.6 1.5 5.2 4.2"/></svg><span class="lbl">Profile</span><span class="lbl-s">Profile</span></a>
      <a href="#settings" data-nav="settings" class="nav-set"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span class="lbl">Settings</span><span class="lbl-s">Settings</span></a>
    </nav>
    <div class="rail-foot">
      <div class="savestate" id="saveState" role="status">Loading…</div>
      <button class="rail-help" type="button" data-action="help" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><span class="kbd" aria-hidden="true">?</span></button>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="titlebar"><a class="crumb" id="viewCrumb" href="#inbox" hidden></a><h1 id="viewTitle">Dashboard</h1><p class="sub" id="viewSub"></p></div>
      <div class="tools" id="tools" role="search">
        <input id="q" type="search" placeholder="Search company, role, notes" aria-label="Search">
        <select id="fTrack" aria-label="Filter by track"><option value="">All tracks</option></select>
        <select id="fSponsor" aria-label="Filter by what the posting says about sponsorship" title="Based on the posting text: yes = it says it sponsors or welcomes CPT/OPT. H-1B history alone does not count."><option value="">Any sponsorship</option><option value="yes">Sponsorship: yes</option><option value="unknown">Sponsorship: not stated</option><option value="no">Sponsorship: no</option></select>
        <button class="btn ghost" id="clearF" type="button" data-action="clear-filters" hidden>Clear filters</button>
      </div>
      <div class="top-acts">
        <button class="btn icon ghost phone-only" type="button" data-action="palette" aria-label="Search"><svg aria-hidden="true" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
        <a class="btn icon ghost phone-only" href="#settings" aria-label="Settings"><svg aria-hidden="true" viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></a>
        <button class="btn primary" id="addBtn" type="button" data-action="add">+ Add application</button>
      </div>
    </header>
    <div class="banner" id="banner" hidden>
      <span><b>Example data.</b> All companies are fictional, and every status, date and listing is a placeholder.</span>
      <button class="btn sm" type="button" data-action="clear-samples">Remove examples</button>
    </div>
    <section id="view" aria-labelledby="viewTitle" tabindex="-1"></section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden></div>
<dialog class="modal" id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog class="menu" id="menu" aria-label="Menu"></dialog>
<aside class="peek" id="peek" aria-labelledby="pkTitle" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">The tracker needs JavaScript.</p></noscript>

<script src="core.js"></script>
<script src="app.js"></script>
<script src="studio.js"></script>
</body>
</html>
