<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internship Tracker</title>
<meta name="description" content="Track internship applications and rank new listings, locally.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2314213D%27/%3E%3Cpath d=%27M9 17l5 5 9-11%27 stroke=%27%23FFBF00%27 stroke-width=%273.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preload" href="fonts/instrument-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-sans-400.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/instrument-sans-500.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/instrument-sans-600.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/instrument-sans-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-500.woff2) format("woff2")}
/* Layout: quiet left rail (bottom tab bar on phones) + one working canvas.
   Colour roles: neutral greys carry the page; navy = primary action and application progress (lighter -> darker = further along);
   amber #FFBF00 = new / needs action soon (fill and stripes only; amber text uses the darker --warn for contrast); red = overdue or a blocking problem; green = offer and positive evidence; grey = closed. */
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --sunk:#E8E8E8; --ink:#222831; --muted:#495464; --faint:#5F6774; --line:#D9DBE0; --line-strong:#BBBFCA;
  --accent:#14213D; --accent-ink:#FFFFFF; --accent-soft:#E2E6EF;
  --st-saved:#5B6E96; --st-applied:#3F67A3; --st-oa:#2B4A80; --st-interview:#14213D; --st-offer:#2E7D57; --st-rejected:#6B7280; --st-withdrawn:#6B7280;
  --good:#2E7D57; --warn:#7A5600; --bad:#C0342A; --hl:#FFBF00; --hl-soft:#FFF2CC;
  --shadow:0 12px 40px rgba(34,40,49,.16);
  --f-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1F26; --surface:#232831; --sunk:#2A303A; --ink:#ECECEA; --muted:#BBBFCA; --faint:#9AA0AB; --line:#363D49; --line-strong:#4A5260;
  --accent:#AFC2E4; --accent-ink:#141821; --accent-soft:#2C3850;
  --st-saved:#9AA7C2; --st-applied:#8FB0DE; --st-oa:#B0C6EA; --st-interview:#DCE5F5; --st-offer:#7CC7A0; --st-rejected:#8C93A0; --st-withdrawn:#8C93A0;
  --good:#7CC7A0; --warn:#FFBF00; --bad:#F2877C; --hl:#FFBF00; --hl-soft:#3D3318; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1F26; --surface:#232831; --sunk:#2A303A; --ink:#ECECEA; --muted:#BBBFCA; --faint:#9AA0AB; --line:#363D49; --line-strong:#4A5260;
  --accent:#AFC2E4; --accent-ink:#141821; --accent-soft:#2C3850;
  --st-saved:#9AA7C2; --st-applied:#8FB0DE; --st-oa:#B0C6EA; --st-interview:#DCE5F5; --st-offer:#7CC7A0; --st-rejected:#8C93A0; --st-withdrawn:#8C93A0;
  --good:#7CC7A0; --warn:#FFBF00; --bad:#F2877C; --hl:#FFBF00; --hl-soft:#3D3318; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px}
.skip:focus{top:8px}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:22px;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:2px;padding-left:8px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg,.ico svg{width:16px;height:16px;flex:none}
.nav .n{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.nav a[aria-current="page"] .n{color:var(--accent)}
.nav .n.hot{color:var(--warn);font-weight:600}
.nav .lbl-s{display:none}
.nav .nav-set{display:none}
.rail-foot{margin-top:auto;font-size:12px;color:var(--faint);padding-left:8px;display:flex;flex-direction:column;gap:8px}
.rail-foot .row{gap:4px;margin-left:-8px}
.savestate{display:flex;align-items:center;gap:6px;color:var(--muted)}
.savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.savestate.warn::before{background:var(--warn)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}

main{min-width:0;padding-block:22px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.titlebar{display:flex;flex-direction:column;margin-right:auto;min-width:0}
h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.top-acts{display:flex;gap:8px;align-items:center}
input[type=search],input[type=text],input[type=url],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type=search]{width:240px;max-width:100%}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
textarea{width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn.icon.sm{width:28px;height:28px;padding:4px}
.btn svg{width:16px;height:16px}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 12px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:13px;background:var(--surface)}
.banner b{color:var(--ink);font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--faint)) 12%,transparent);color:var(--c,var(--muted))}
.chip.tag{--c:var(--muted);background:var(--sunk)}
.chip.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-saved{--c:var(--st-saved)}.s-applied{--c:var(--st-applied)}.s-oa{--c:var(--st-oa)}.s-interview{--c:var(--st-interview)}
.s-offer{--c:var(--st-offer)}.s-rejected{--c:var(--st-rejected)}.s-withdrawn{--c:var(--st-withdrawn)}.s-closed{--c:var(--st-rejected)}
.s-missed{--c:var(--st-withdrawn)}.s-ghosted{--c:var(--st-withdrawn)}.s-expired{--c:var(--st-withdrawn)}
.v-yes{--c:var(--good)}.v-no{--c:var(--bad)}.v-unknown{--c:var(--muted)}
.chip.fu{--c:var(--good)}
.chip.new{background:var(--hl-soft);color:var(--warn);font-weight:600}
.chip.miss{--c:var(--muted);background:transparent;border:1px dashed var(--line)}
.prio{display:inline-flex;gap:2px;align-items:flex-end}
.prio i{width:4px;border-radius:1px;background:var(--line)}
.prio i:nth-child(1){height:6px}.prio i:nth-child(2){height:9px}.prio i:nth-child(3){height:12px}
.prio i.on{background:var(--accent)}
.eff{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.eff.now{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.eff.later{background:var(--hl-soft);color:var(--warn)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .l abbr{text-decoration:none;cursor:help;border-bottom:1px dotted var(--faint)}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v.dim{color:var(--faint)}
.kpi .h{font-size:12px;color:var(--faint)}
.kpi .h .small{color:var(--warn);font-weight:500}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"att top" "pipe track" "week week";gap:16px}
.a-att{grid-area:att}.a-top{grid-area:top}.a-pipe{grid-area:pipe}.a-track{grid-area:track}.a-week{grid-area:week}
.panel-foot{display:flex;justify-content:flex-start;margin-top:auto}
.u-soon{box-shadow:inset 3px 0 0 var(--hl)}
.u-hot{box-shadow:inset 3px 0 0 var(--bad)}
.due{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.due.soon{color:var(--warn);font-weight:600}.due.hot{color:var(--bad);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:13px;margin:0;font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.panel h2 small{font-weight:400;color:var(--faint);font-size:12px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);border-radius:4px}
.todo li:first-child{border-top:0}
.todo li:hover{background:var(--sunk)}
.todo .what{all:unset;cursor:pointer;min-width:0;display:block}
.todo .what:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.todo .what b{font-weight:600}
.todo .what span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.kind{font-size:11.5px;font-weight:500;color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.empty{color:var(--faint);font-size:13px;margin:0}
.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:92px minmax(0,1fr) 76px;gap:10px;align-items:center;font-size:13px}
.fbar{height:18px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fbar span{display:block;height:100%;background:var(--c);border-radius:3px}
.frow .num{font-family:var(--f-mono);text-align:right;font-size:12.5px;color:var(--muted)}
.frow .num b{color:var(--ink);font-weight:500}
.chart svg{display:block;max-width:100%;height:auto}
.chartbox{width:100%;min-width:0}
.chart text{fill:var(--faint);font-family:var(--f-mono);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent);opacity:.38}
.chart .bar.now{opacity:1}
.chart .val{fill:var(--ink)}
.chart .goal{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart .goal-l{fill:var(--warn);font-weight:600}
.tracks{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.trow .seg{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.trow .seg span{display:block;height:100%}
.trow .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.today{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.today .tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:5px;color:var(--ink);min-width:0}
.today .k{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;min-height:24px}
.today .k .btn{margin-left:auto;margin-right:-6px}
.today .t{font-size:22px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.today .t.dim{color:var(--faint)}
.today .s{font-size:12px;color:var(--faint)}
.today .s .small{color:var(--warn);font-weight:500}
.today .go{color:var(--accent);font-size:12.5px;font-weight:500;text-decoration:none}
.today .go:hover{text-decoration:underline}
.today .hot{color:var(--bad)}.today .soon{color:var(--warn)}
.today form{display:flex;gap:6px;align-items:center}
.today form input{width:70px}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog.done span{background:var(--good)}
.notice{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.notice .grow{margin-right:auto}
.notice.warn{border-color:color-mix(in srgb,var(--hl) 70%,var(--line));background:color-mix(in srgb,var(--hl-soft) 60%,var(--surface));color:var(--ink);justify-content:space-between;flex-wrap:wrap}
.tmatch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tmatch li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line)}
.tmatch li:first-child{border-top:0}
.tmatch .what{all:unset;cursor:pointer;min-width:0}
.tmatch .what b{font-weight:600}
.tmatch .what>span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:1 1 228px;min-width:228px;background:var(--sunk);border-radius:var(--r);padding:0 8px 8px;border-top:3px solid var(--c);min-height:180px;transition:background .15s}
.col.collapsed{flex:0 0 150px;min-width:150px;min-height:0}
.col .colbtn{all:unset;cursor:pointer;display:block;text-align:center;padding:8px 6px;border-radius:6px;color:var(--accent);font-weight:500;font-size:12.5px}
.col .colbtn:hover{background:var(--surface)}
.col .colbtn:focus-visible{outline:2px solid var(--accent)}
.col.over{background:var(--accent-soft)}
.col h2{display:flex;align-items:center;gap:8px;padding:10px 4px 9px;font-weight:600;font-size:13px;margin:0}
.col h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col h2 .count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--faint);font-weight:400}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.card:hover{border-color:var(--faint)}
.card.dragging{opacity:.45}
.card.u-soon{box-shadow:inset 3px 0 0 var(--hl)}.card.u-hot{box-shadow:inset 3px 0 0 var(--bad)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .role{font-size:13px;color:var(--muted);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.meta{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--faint)}
.meta .next{color:var(--ink)}
.meta .fu-done{color:var(--good)}
.meta .rd{color:var(--accent);font-weight:500}
.card .move{display:none;font-size:12.5px;padding:4px 6px}
@media (hover:none){.card .move{display:block}}
.col .empty{padding:14px 6px;text-align:center;border:1px dashed var(--line);border-radius:6px}

/* saved items in the queue */
.qbadge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.lrow.qsaved,.tmatch li.qsaved{background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
.tmatch li.qsaved .what b{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.tmatch .what span .due,.tmatch .what span .dl{display:inline}
.card .qacts{display:flex;gap:6px;align-items:center}
/* stage filter */
.stagef{display:inline-flex;flex-wrap:wrap;gap:6px}
.stagef button{all:unset;cursor:pointer;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);background:var(--surface)}
.stagef button:hover{border-color:var(--line-strong);color:var(--ink)}
.stagef button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stagef button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stagef .c{font-family:var(--f-mono);font-size:11.5px;opacity:.8;margin-left:4px}
/* list sections */
.tsecs{display:flex;flex-direction:column;gap:14px}
.tsec{display:flex;flex-direction:column;gap:8px}
.tsec-h{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:2px;font-size:14px;font-weight:600}
.tsec-h:disabled{cursor:default}
.tsec-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.tsec-h .cnt{font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--faint)}
.tsec-h .hint{font-weight:400;font-size:12.5px;color:var(--faint)}
.tsec-h .car{color:var(--faint);transition:transform .15s;align-self:center}
