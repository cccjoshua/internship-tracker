<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internship Application Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet left rail (bottom tab bar on phones) + one working canvas.
   Colour roles: neutral greys carry the page; navy = primary action and application progress (lighter -> darker = further along);
   yellow = new / needs action soon; red = overdue or a blocking problem; green = offer only; grey = closed. */
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --sunk:#E8E8E8; --ink:#222831; --muted:#495464; --faint:#5F6774; --line:#D9DBE0; --line-strong:#BBBFCA;
  --accent:#14213D; --accent-ink:#FFFFFF; --accent-soft:#E2E6EF;
  --st-saved:#5B6E96; --st-applied:#3F67A3; --st-oa:#2B4A80; --st-interview:#14213D; --st-offer:#2E7D57; --st-rejected:#6B7280; --st-withdrawn:#6B7280;
  --good:#2E7D57; --warn:#8A6100; --bad:#C0342A; --hl:#F2C230; --hl-soft:#FFF2C2;
  --shadow:0 12px 40px rgba(34,40,49,.16);
  --f-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1F26; --surface:#232831; --sunk:#2A303A; --ink:#ECECEA; --muted:#BBBFCA; --faint:#9AA0AB; --line:#363D49; --line-strong:#4A5260;
  --accent:#AFC2E4; --accent-ink:#141821; --accent-soft:#2C3850;
  --st-saved:#9AA7C2; --st-applied:#8FB0DE; --st-oa:#B0C6EA; --st-interview:#DCE5F5; --st-offer:#7CC7A0; --st-rejected:#8C93A0; --st-withdrawn:#8C93A0;
  --good:#7CC7A0; --warn:#F2C230; --bad:#F2877C; --hl:#F2C230; --hl-soft:#3F3720; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1F26; --surface:#232831; --sunk:#2A303A; --ink:#ECECEA; --muted:#BBBFCA; --faint:#9AA0AB; --line:#363D49; --line-strong:#4A5260;
  --accent:#AFC2E4; --accent-ink:#141821; --accent-soft:#2C3850;
  --st-saved:#9AA7C2; --st-applied:#8FB0DE; --st-oa:#B0C6EA; --st-interview:#DCE5F5; --st-offer:#7CC7A0; --st-rejected:#8C93A0; --st-withdrawn:#8C93A0;
  --good:#7CC7A0; --warn:#F2C230; --bad:#F2877C; --hl:#F2C230; --hl-soft:#3F3720; --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:22px;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:2px;padding-left:8px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none}
.nav .n{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.nav a[aria-current="page"] .n{color:var(--accent)}
.nav .lbl-s{display:none}
.rail-foot{margin-top:auto;font-size:12px;color:var(--faint);padding-left:8px;display:flex;flex-direction:column;gap:6px}
.savestate{display:flex;align-items:center;gap:6px;color:var(--muted)}
.savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.savestate.warn::before{background:var(--warn)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

main{min-width:0;padding-block:22px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.titlebar{display:flex;flex-direction:column;margin-right:auto;min-width:0}
h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
input[type=search],input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{width:240px;max-width:100%}
textarea{width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 12px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:13px;background:var(--surface)}
.banner b{color:var(--ink);font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--faint)) 12%,transparent);color:var(--c,var(--muted))}
.chip.tag{--c:var(--muted);background:var(--sunk)}
.chip.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-saved{--c:var(--st-saved)}.s-applied{--c:var(--st-applied)}.s-oa{--c:var(--st-oa)}.s-interview{--c:var(--st-interview)}
.s-offer{--c:var(--st-offer)}.s-rejected{--c:var(--st-rejected)}.s-withdrawn{--c:var(--st-withdrawn)}.s-closed{--c:var(--st-rejected)}
.v-yes{--c:var(--good)}.v-no{--c:var(--bad)}.v-unknown{--c:var(--muted)}
.prio{display:inline-flex;gap:2px;align-items:flex-end}
.prio i{width:4px;border-radius:1px;background:var(--line)}
.prio i:nth-child(1){height:6px}.prio i:nth-child(2){height:9px}.prio i:nth-child(3){height:12px}
.prio i.on{background:var(--accent)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--faint)}
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"att top" "pipe track" "week week";gap:16px}
.a-att{grid-area:att}.a-top{grid-area:top}.a-pipe{grid-area:pipe}.a-track{grid-area:track}.a-week{grid-area:week}
.panel-foot{display:flex;justify-content:flex-start;margin-top:auto}
.kpi .l abbr{text-decoration:none;cursor:help;border-bottom:1px dotted var(--faint)}
/* urgency stripes: yellow = act soon, red = overdue */
.u-soon{box-shadow:inset 3px 0 0 var(--hl)}
.u-hot{box-shadow:inset 3px 0 0 var(--bad)}
.chip.new{background:var(--hl-soft);color:var(--warn);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}.due.hot{color:var(--bad);font-weight:600}
/* score badge: navy filled = strong, tint = good, grey = weak */
.sc{display:inline-grid;place-items:center;min-width:38px;height:26px;padding:0 6px;border-radius:6px;font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.sc.b1{background:var(--accent);color:var(--accent-ink)}.sc.b2{background:var(--accent-soft);color:var(--accent)}.sc.b3{background:var(--sunk);color:var(--muted)}
/* compact listing rows */
.lsec{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lsec+.lsec{margin-top:12px}
.lsec-h{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;cursor:pointer;font-weight:600;font-size:13px;background:var(--surface)}
.lsec-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lsec-h .cnt{font-family:var(--f-mono);font-weight:400;color:var(--faint)}
.lsec-h .car{margin-left:auto;color:var(--faint);transition:transform .15s}
.lsec-h[aria-expanded="true"] .car{transform:rotate(90deg)}
.lsec-h .hint{font-weight:400;color:var(--faint);font-size:12px}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.lrow:hover{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.lmain{all:unset;box-sizing:border-box;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px}
.lmain:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.lmain .l1{display:flex;align-items:center;gap:6px;min-width:0}
.lmain .l1 b{font-weight:600;white-space:nowrap}
.lmain .l1 .role{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lmain .l2{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--faint)}
.lmain .l2 .neg{color:var(--bad);font-weight:600}.lmain .l2 .pos{color:var(--good);font-weight:600}
.lacts{display:flex;gap:4px;align-items:center}
.ldetail{grid-column:2/-1;display:flex;flex-direction:column;gap:6px;padding:4px 0 6px}
.more{all:unset;cursor:pointer;padding:9px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:500;font-size:13px}
.more:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--muted);font-size:13px}
.toolbar .grow{margin-right:auto}
.tmatch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tmatch li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line)}
.tmatch li:first-child{border-top:0}
.tmatch .what{all:unset;cursor:pointer;min-width:0}
.tmatch .what b{font-weight:600}
.tmatch .what span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:13px;margin:0;font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.panel h2 small{font-weight:400;color:var(--faint);font-size:12px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px}
.todo li:first-child{border-top:0}
.todo li:hover{background:var(--sunk)}
.todo .what{all:unset;cursor:pointer;min-width:0;display:block}
.todo .what:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.s-missed{--c:var(--st-withdrawn)}.s-ghosted{--c:var(--st-withdrawn)}.s-expired{--c:var(--st-withdrawn)}
.chip.fu{--c:var(--good)}
.meta .fu-done{color:var(--good)}
/* recommended action */
.act{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.act.now{background:var(--accent);color:var(--accent-ink)}.act.tailor{background:var(--hl-soft);color:var(--warn)}.act.low{background:var(--sunk);color:var(--muted)}
.rv{font-weight:600;color:var(--ink)}
.add{color:var(--warn)}
/* today strip */
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.today a,.today div{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);min-width:0}
.today a:hover{background:color-mix(in srgb,var(--sunk) 50%,var(--surface))}
.today .k{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.today .t{font-size:15px;font-weight:600}
.today .s{font-size:12px;color:var(--faint)}
.today .go{color:var(--accent);font-size:12.5px;font-weight:500}
.today .hot{color:var(--bad)}.today .soon{color:var(--warn)}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog.done span{background:var(--good)}
.notice{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.queue{border-color:var(--accent)}
.queue .lsec-h{cursor:default}
.chart .goal{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
.chart .goal-l{fill:var(--warn);font-weight:600}
@media (max-width:1080px){.today{grid-template-columns:repeat(2,minmax(0,1fr))}}
.todo .what b{font-weight:600}
.todo .what span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.due{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.due.hot{color:var(--bad)}.due.soon{color:var(--warn)}
.kind{font-size:11.5px;font-weight:500;color:var(--muted)}
.empty{color:var(--faint);font-size:13px;margin:0}
.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:92px minmax(0,1fr) 76px;gap:10px;align-items:center;font-size:13px}
.fbar{height:18px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fbar span{display:block;height:100%;background:var(--c);border-radius:3px}
.frow .num{font-family:var(--f-mono);text-align:right;font-size:12.5px;color:var(--muted)}
.frow .num b{color:var(--ink);font-weight:500}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-family:var(--f-mono);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent);opacity:.38}
.chart .bar.now{opacity:1}
.chart .val{fill:var(--ink)}
.tracks{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.trow .seg{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.trow .seg span{display:block;height:100%}
.trow .num{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:1 1 228px;min-width:228px;background:var(--sunk);border-radius:var(--r);padding:0 8px 8px;border-top:3px solid var(--c);min-height:180px;transition:background .15s}
.col.collapsed{flex:0 0 150px;min-width:150px;min-height:0}
.col .colbtn{all:unset;cursor:pointer;display:block;text-align:center;padding:8px 6px;border-radius:6px;color:var(--accent);font-weight:500;font-size:12.5px}
.col .colbtn:hover{background:var(--surface)}
.col .colbtn:focus-visible{outline:2px solid var(--accent)}
.card.u-soon{box-shadow:inset 3px 0 0 var(--hl)}.card.u-hot{box-shadow:inset 3px 0 0 var(--bad)}
.col.over{background:var(--accent-soft)}
.col h2{display:flex;align-items:center;gap:8px;padding:10px 4px 9px;font-weight:600;font-size:13px;margin:0}
.col h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.col h2 .count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--faint);font-weight:400}
.cards{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.card:hover{border-color:var(--faint)}
.card.dragging{opacity:.45}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .role{font-size:13px;color:var(--muted);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.meta{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--faint)}
.meta .next{color:var(--ink)}
.card .move{display:none;font-size:12.5px;padding:4px 6px}
@media (hover:none){.card .move{display:block}}
.col .empty{padding:14px 6px;text-align:center;border:1px dashed var(--line);border-radius:6px}

/* table */
.tablewrap{overflow:auto;max-height:calc(100vh - 210px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
thead th{position:sticky;top:0;z-index:1;background:var(--surface)}
tbody tr.closed td{color:var(--faint)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:0;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
th button{all:unset;cursor:pointer;display:block;padding:9px 12px}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th .arr{color:var(--accent)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.co{font-weight:600;white-space:nowrap}
td.co button{all:unset;cursor:pointer}
td.co button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
td.ro{color:var(--muted);max-width:280px}
td.dt{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--muted)}
td select{padding:3px 6px;font-size:12.5px}
td .sub2{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;white-space:normal;max-width:340px}
td .sub2 .chip{margin-right:4px}
td.co{white-space:normal;min-width:220px}
select.stsel{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:3px 22px 3px 10px;font-size:12px;font-weight:600;cursor:pointer;

function syncApplied(a){const h=a.history.find(x=>x.s==='applied');if(h)a.applied=h.d;else if(a.status==='saved')a.applied=''}

/* Same formula as fetcher.score(): stored components in [0,1] for everything except recency, which is computed live. */
function scoreParts(l){const w=S.settings.weights,t=l.track||inferTrack(l.role);

    <section class="panel chart a-week"><h2>Applications per week <small>last 8 weeks · dashed line is your weekly goal</small></h2>${svg}</section>
  </div></div>`;
};

function urgency(a){
  if(CLOSED.includes(a.status))return'';
  if(a.status==='saved'&&a.deadline){const n=daysFrom(a.deadline);if(n<0)return'u-hot';if(n<=3)return'u-soon'}
  if(a.nextDate&&a.nextText){const n=daysFrom(a.nextDate);if(n<0)return'u-hot';if(n<=3)return'u-soon'}
  if(followUps().includes(a)||staleApps().includes(a))return'u-soon';
  return''}
function card(a){
  let meta='';
  if(a.status==='saved')meta=a.deadline?`<span class="due ${dueCls(daysFrom(a.deadline))}">Deadline ${fmt(a.deadline)}</span>`:'<span>No deadline</span>';
  else if(a.applied)meta=`<span>Applied ${ago(a.applied)}</span>`;
  if(a.status==='applied'&&quietDays(a)>=(+S.settings.followUpDays||14))meta+=`<span class="due soon">No reply for ${quietDays(a)} days</span>`;
  if(followText(a)&&!CLOSED.includes(a.status))meta+=`<span class="fu-done">✓ ${followText(a)}</span>`;
  if(a.nextText)meta+=`<span class="next">→ ${esc(a.nextText)}${a.nextDate?' · '+fmt(a.nextDate):''}</span>`;
  return `<li class="card ${urgency(a)}" draggable="true" data-id="${a.id}" data-open="${a.id}" tabindex="0" aria-label="${esc(a.company+', '+a.role+', '+LABEL[a.status])}">
    <div class="card-top"><strong>${esc(a.company)}</strong>${prio(a.priority)}</div>
    <div class="role">${esc(a.role)}</div>
    <div class="chips">${a.track?`<span class="chip tag">${a.track}</span>`:''}${a.sponsor!=='unknown'?spChip(a.sponsor):''}${CLOSED.includes(a.status)?stChip(a.status):''}</div>
    <div class="meta">${meta}</div>
    <select class="move" data-status-for="${a.id}" aria-label="Move ${esc(a.company)} to stage">${opts(STAGES,a.status)}</select></li>`;
}
const COL_LIMIT=6;
function colSort(s){
  if(s==='saved')return(x,y)=>(x.deadline||'9').localeCompare(y.deadline||'9')||y.priority-x.priority;
  if(s==='applied')return(x,y)=>quietDays(y)-quietDays(x)||y.priority-x.priority;  // longest silence first
  if(s==='closed')return(x,y)=>(lastDate(y)||'').localeCompare(lastDate(x)||'');
  return(x,y)=>(x.nextDate||'9').localeCompare(y.nextDate||'9')||y.priority-x.priority}
R.board=()=>{const A=filtered();const cols=['saved','applied','oa','interview','offer','closed'];
  return `<div class="board">${cols.map(s=>{const items=A.filter(a=>s==='closed'?CLOSED.includes(a.status):a.status===s).sort(colSort(s));
    const name=s==='closed'?'Closed':LABEL[s];
    if(s==='closed'&&!S.ui.closedOpen)return `<section class="col collapsed s-closed" data-drop="closed" aria-label="Closed, ${items.length} applications, collapsed"><h2><span class="dot"></span>Closed<span class="count">${items.length}</span></h2><button class="colbtn" type="button" data-action="closed-toggle">Show</button></section>`;
    const lim=UI.limits['col-'+s]||COL_LIMIT,vis=items.slice(0,lim);
    return `<section class="col s-${s}" data-drop="${s}" aria-label="${name}, ${items.length} applications"><h2><span class="dot"></span>${name}<span class="count">${items.length}</span></h2>${items.length?`<ul class="cards">${vis.map(card).join('')}</ul>`:'<p class="empty">Drop a card here</p>'}${items.length>lim?`<button class="colbtn" type="button" data-more="col-${s}">Show ${items.length-lim} more</button>`:''}${s==='closed'?'<button class="colbtn" type="button" data-action="closed-toggle">Hide closed</button>':''}</section>`}).join('')}</div>`};

/* One computed "what happens next" per application, so the table needs no separate deadline, next-step or follow-up columns. rank: lower = sooner. */
function nextAction(a){const fu=+S.settings.followUpDays||14,sd=+S.settings.staleDays||45;
  if(CLOSED.includes(a.status))return{t:LABEL[a.status],s:fmt(lastDate(a)),c:'mut',r:1e5};
  if(a.nextText&&a.nextDate){const n=daysFrom(a.nextDate);return{t:a.nextText,s:`${fmt(a.nextDate)} · ${dueText(n)}`,c:n<0?'hot':n<=3?'soon':'',r:n}}
  if(a.status==='saved'){if(a.deadline){const n=daysFrom(a.deadline);return n<0?{t:'Deadline passed',s:`${fmt(a.deadline)} · mark missed?`,c:'hot',r:n}:{t:'Apply by '+fmt(a.deadline),s:dueText(n),c:n<=3?'hot':n<=7?'soon':'',r:n}}
    return{t:'Apply',s:'no deadline listed',c:'',r:30}}
  if(a.status==='applied'){const q=quietDays(a),snz=a.snoozeUntil&&daysFrom(a.snoozeUntil)>0;
    if(!snz&&q>=sd)return{t:'No reply · close?',s:`silent ${q} days`,c:'soon',r:0.5};
    if(!snz&&q>=fu)return{t:'Follow up',s:`quiet ${q} days`,c:'soon',r:-0.5};
    const base=snz?a.snoozeUntil:(()=>{const d=parse(maxDate(lastDate(a),a.followedUp));d.setDate(d.getDate()+fu);return iso(d)})();
    return{t:a.followedUp?`Followed up ${fmt(a.followedUp)}`:'Waiting for reply',s:`follow up ${fmt(base)}`,c:'',r:60+(daysFrom(base)||0)}}
  if(a.status==='offer')return{t:'Respond to offer',s:'add the reply deadline as next step',c:'soon',r:2};
  return{t:'Add the next step',s:`${LABEL[a.status]} · ${ago(lastDate(a))}`,c:'soon',r:5}}
const vis=s=>s==='yes'?'<span class="vis yes" title="Sponsors visa / CPT-OPT friendly" aria-label="Sponsors visa">✓</span>':s==='no'?'<span class="vis no" title="No sponsorship" aria-label="No sponsorship">✕</span>':'<span class="sr-only">Unknown</span>';
const COLS=[['company','Company · Role'],['status','Status'],['applied','Applied'],['action','Next action'],['resume','Resume'],['sponsor','Visa']];
R.table=()=>{const{key,dir}=S.ui.sort;
  const val=a=>key==='status'?ORDER[a.status]:key==='action'?nextAction(a).r*10-a.priority:key==='sponsor'?({yes:0,no:1,unknown:2})[a.sponsor]:String(a[key]||'').toLowerCase();
  const all=filtered(),nClosed=all.filter(a=>CLOSED.includes(a.status)).length;
  const A0=(S.ui.showClosed?all:all.filter(a=>!CLOSED.includes(a.status))).sort((x,y)=>{const a=val(x),b=val(y);if(a===''&&b!=='')return 1;if(b===''&&a!=='')return -1;return(a>b?1:a<b?-1:0)*dir});
  const A=A0.slice(0,UI.tableLimit);
  const bar=`<div class="toolbar" style="margin-bottom:10px"><span class="grow">${A0.length} application${A0.length===1?'':'s'}${S.ui.showClosed?'':` · ${nClosed} closed hidden`} · sorted by ${esc((COLS.find(c=>c[0]===key)||COLS[3])[1].toLowerCase())}</span>
    <label class="switch"><input type="checkbox" id="showClosed" ${S.ui.showClosed?'checked':''}> Show closed</label></div>`;
  if(!A.length)return bar+`<div class="panel"><p class="empty">No applications match. Clear the search or filters, turn on “Show closed”, or press N to add one.</p></div>`;
  const applied=a=>{if(!a.applied)return'<span class="sr-only">Not applied</span>—';const n=-daysFrom(a.applied);return `${fmt(a.applied)}<span class="na-s" style="display:block">${n<=0?'today':n+'d ago'}</span>`};
  return bar+`<div class="tablewrap"><table><thead><tr>${COLS.map(([k,l])=>`<th scope="col" aria-sort="${key===k?(dir>0?'ascending':'descending'):'none'}"><button type="button" data-sort="${k}">${l} ${key===k?`<span class="arr" aria-hidden="true">${dir>0?'↑':'↓'}</span>`:''}</button></th>`).join('')}</tr></thead><tbody>
  ${A.map(a=>{const na=nextAction(a);return `<tr data-open="${a.id}" class="${CLOSED.includes(a.status)?'closed':''}"><td class="co ${urgency(a)}"><button type="button" data-open="${a.id}">${esc(a.company)}</button><span class="sub2">${a.track?`<span class="chip tag">${a.track}</span>`:''}${esc(a.role)}</span></td>
  <td><select class="stsel s-${a.status}" data-status-for="${a.id}" aria-label="Status for ${esc(a.company)}">${opts(STAGES,a.status)}</select></td>
  <td class="dt">${applied(a)}</td>
  <td class="na"><span class="na-t ${na.c}">${esc(na.t)}</span><span class="na-s">${esc(na.s)}</span></td>
  <td class="rs" title="${esc(a.resume||resumeFor(a))}">${a.resume?esc(a.resume):`<span style="color:var(--faint)">${esc(resumeFor(a))} (base)</span>`}</td><td class="vi">${vis(a.sponsor)}</td></tr>`}).join('')}
  </tbody></table>${A0.length>A.length?`<button class="more" type="button" data-action="table-more" style="display:block;width:100%;box-sizing:border-box">Show ${Math.min(25,A0.length-A.length)} more of ${A0.length-A.length}</button>`:''}</div>`};

function evidence(l){
  const h=l.h1b===null||l.h1b===undefined?(l.source==='simplify'?'No H-1B record found for this employer':''):`${Number(l.h1b).toLocaleString('en-US')} H-1B approvals (USCIS FY2023)`;
  const fl=(l.flags||[]).map(f=>`<span class="chip ${f==='CPT/OPT friendly'?'v-yes':f==='No sponsorship'?'v-no':'tag'}">${esc(f)}${f==='No sponsorship'&&l.penalty?` −${l.penalty}`:''}</span>`).join('');
  return h||fl?`<div class="ev"><span>${esc(h)}</span>${fl}</div>`:''}
function skillLine(l){const m=(l.skills&&l.skills.matched)||[],x=(l.skills&&l.skills.missing)||[];
  if(!m.length&&!x.length)return l.source==='simplify'?`<div class="sk empty">${l.textRead?'No specific tools named in the posting':'Posting text could not be read; skill match counted as neutral'}</div>`:'';
  return `<div class="sk"><span class="sk-l">Skills ${m.length}/${m.length+x.length}</span>${m.map(s=>`<span class="chip v-yes">${esc(s)}</span>`).join('')}${x.map(s=>`<span class="chip miss">${esc(s)}</span>`).join('')}</div>`}
function fetchSummary(){const f=S.fetch;if(!f)return Store.mode==='file'?'Not refreshed yet':'Example feed (the local version refreshes from SimplifyJobs)';
  const at=new Date(f.at),hrs=+S.settings.fetchHours||2,next=new Date(at.getTime()+hrs*3600e3);
  const t=d=>d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `Refreshed ${t(at)}${at.toDateString()!==new Date().toDateString()?' '+fmt(iso(at)):''}${f.new?` · ${f.new} new`:''}${f.removed?` · ${f.removed} closed or expired removed`:''} · next about ${t(next)}${f.error?` · <span class="due hot">last refresh failed: ${esc(f.error)}</span>`:''}`}
let refreshing=false;
R.inbox=()=>{const t=(S.ui.q||'').toLowerCase().trim();
  let L=S.listings.map(l=>Object.assign({},l,scoreParts(l),{t:l.track||inferTrack(l.role),dup:findDup(l.company,l.role,l.url)}));
  const hidden=S.settings.hideNoSponsor?L.filter(l=>l.sponsor==='no').length:0;
  if(S.settings.hideNoSponsor)L=L.filter(l=>l.sponsor!=='no');
  if(S.ui.sponsor)L=L.filter(l=>l.sponsor===S.ui.sponsor);
  if(S.ui.track)L=L.filter(l=>l.t===S.ui.track);
  if(t)L=L.filter(l=>(l.company+' '+l.role+' '+l.location).toLowerCase().includes(t));
  L.sort((a,b)=>(!!a.dup-!!b.dup)||b.total-a.total);
  const ex=S.fetch&&S.fetch.excluded?Object.entries(S.fetch.excluded).sort((a,b)=>b[1]-a[1]):[];
  const head=`<div class="inbox-head"><p><b>${L.length}</b> listing${L.length===1?'':'s'} ranked by fit${hidden?` · ${hidden} hidden without sponsorship`:''}<br><span class="sub">${fetchSummary()}</span></p>
    <select id="lsort" aria-label="Sort listings"><option value="score"${S.ui.lsort!=='newest'?' selected':''}>Best match first</option><option value="newest"${S.ui.lsort==='newest'?' selected':''}>Newest first</option></select>
    <label class="switch"><input type="checkbox" id="hideNo" ${S.settings.hideNoSponsor?'checked':''}> Hide no-sponsorship</label>
    <button class="btn sm" type="button" data-action="refresh" ${refreshing?'disabled':''}>${refreshing?'Refreshing…':'Refresh now'}</button></div>
    ${ex.length?`<details class="why exl"><summary>Filtered out this refresh: ${ex.reduce((s,e)=>s+e[1],0).toLocaleString('en-US')}</summary><div class="parts">${ex.map(([k,n])=>`<span>${esc(k)} <b>${n.toLocaleString('en-US')}</b></span>`).join('')}</div></details>`:''}`;
  if(!L.length)return head+`<div class="panel" style="margin-top:12px"><p class="empty">No listings match. Refresh now, clear the filters, or widen the window in Preferences.</p></div>`;
  if(S.ui.lsort==='newest')L.sort((a,b)=>(!!a.dup-!!b.dup)||(b.posted||'').localeCompare(a.posted||'')||b.total-a.total);
  const topS=+S.settings.topScore||75,minS=+S.settings.minScore||55,open=S.ui.sec||{};
  const filtering=!!(S.ui.q||S.ui.track||S.ui.sponsor);
  const Q=filtering?[]:queueList(),qids=new Set(Q.map(l=>l.id)),rest=L.filter(l=>!qids.has(l.id));
  const goal=+S.settings.dailyGoal||3,done=appliedOn(iso(TODAY));
  const queue=Q.length?`<section class="lsec queue" aria-label="Today's queue"><div class="lsec-h"><span>Today’s queue</span><span class="hint">best “Apply now” picks · open the posting, apply, then press Applied</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:500"><span class="hint">Applied today</span> <b class="mono">${done}/${goal}</b><span class="prog ${done>=goal?'done':''}" style="width:90px"><span style="width:${Math.min(100,done/goal*100)}%"></span></span></span></div>
      ${Q.map(lrow).join('')}</section>`:'';
  const groups=[
    ['new','New since the last refresh','',rest.filter(l=>!l.dup&&l.isNew&&l.total>=minS),true],
    ['top',`Top matches`,`score ${topS}+`,rest.filter(l=>!l.dup&&!l.isNew&&l.total>=topS),true],
    ['more','More matches',`score ${minS}–${topS-1}`,rest.filter(l=>!l.dup&&!l.isNew&&l.total>=minS&&l.total<topS),false],
    ['low','Lower matches',`below ${minS}`,rest.filter(l=>!l.dup&&l.total<minS),false],
    ['dup','Already tracking','',rest.filter(l=>l.dup),false]].filter(g=>g[3].length);
  const legend=`<div class="toolbar" style="margin-top:10px"><span class="act now">Apply now</span><span>score ${topS}+ and at most 1 missing skill</span><span class="act tailor">Tailor first</span><span>add the missing skills you truly have, then apply</span><span class="act low">Low priority</span><span>below ${minS} or no sponsorship</span></div>`;
  return head+legend+`<div style="margin-top:12px">${queue}${Q.length?'<div style="height:12px"></div>':''}${groups.map(([k,title,hint,items,def])=>{
    const isOpen=open[k]!==undefined?open[k]:def,lim=UI.limits['sec-'+k]||25;
    return `<section class="lsec" aria-label="${esc(title)}"><button class="lsec-h" type="button" data-sec="${k}" aria-expanded="${isOpen}">${k==='new'?'<span class="chip new">New</span>':''}${esc(title)} <span class="cnt">${items.length}</span>${hint?`<span class="hint">${esc(hint)}</span>`:''}<span class="car" aria-hidden="true">›</span></button>
      ${isOpen?items.slice(0,lim).map(lrow).join('')+(items.length>lim?`<button class="more" type="button" data-more="sec-${k}">Show ${Math.min(25,items.length-lim)} more of ${items.length-lim}</button>`:''):''}</section>`}).join('')}</div>`};
const dlTag=d=>{const n=daysFrom(d);return n===null?'':`<span class="dl ${n<0?'hot':n<=7?'soon':''}" title="Application deadline stated in the posting">${n<0?'Deadline passed':'Deadline '+fmt(d)}${n>=0&&n<=7?' · '+dueText(n).toLowerCase():''}</span>`};
function lrow(l){
  const sk=l.skills||{},m=(sk.matched||[]).length,n=m+(sk.missing||[]).length,ex=UI.expanded.has(l.id);
  const locs=(l.location||'').split('; '),loc=locs.length>2?locs.slice(0,2).join('; ')+` +${locs.length-2}`:l.location;
  const h=l.h1b===null||l.h1b===undefined?(l.source==='simplify'?'No H-1B record':''):`${Number(l.h1b).toLocaleString('en-US')} H-1B`;
  const flags=(l.flags||[]).filter(f=>f!=='Text not read').map(f=>`<span class="${f==='No sponsorship'?'neg':'pos'}">${esc(f)}</span>`).join('');

  return `<article class="lrow" aria-label="${esc(l.company+', '+l.role+', score '+l.total)}">

    <button class="lmain" type="button" data-expand="${l.id}" aria-expanded="${ex}">

      ${todo}<span class="l2">${l.t?`<span>${esc(l.t)}</span>`:''}<span>${esc(loc||'')}</span>${l.posted?`<span>${ago(l.posted)}</span>`:''}${dlTag(l.deadline)}${h?`<span>${h}</span>`:''}${n?`<span>Skills ${m}/${n}</span>`:''}${flags}${l.dup?`<span class="pos">Tracking · ${LABEL[l.dup.status]}</span>`:''}</span>
    </button>
    <span class="lacts">${l.dup?`<button class="btn sm" type="button" data-open="${l.dup.id}">Open</button>`:`<button class="btn sm primary" type="button" data-trackl="${l.id}" title="Save to your board">Track</button><button class="btn sm" type="button" data-appliedl="${l.id}" title="Add to your board as applied today">Applied</button>`}${link(l.url,'Posting ↗')}<button class="btn sm ghost" type="button" data-dismiss="${l.id}" aria-label="Dismiss ${esc(l.company)}" title="Dismiss">✕</button></span>
    ${ex?`<div class="ldetail">${evidence(l)}${skillLine(l)}<div class="why"><div class="parts">${l.parts.map(p=>`<span>${WEIGHT_SHORT[p.k]} <b>${Math.round(p.pts)}/${Math.round(p.max)}</b></span>`).join('')}${l.pen?`<span>No-sponsorship penalty <b>−${l.pen}</b></span>`:''}<span>Degree ${esc(l.degree||'—')}</span><span>Posted ${fmt(l.posted)}</span>${l.deadline?`<span>Deadline <b>${fmt(l.deadline)}</b></span>`:`<span>No deadline stated</span>`}</div></div></div>`:''}

function dateIssues(hist){const first={},out=[];for(const h of hist)if(!first[h.s]||h.d<first[h.s])first[h.s]=h.d;

/* ---------- import / export ---------- */
function parseCSV(text){const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function normStatus(s){s=(s||'').toLowerCase();if(/offer/.test(s))return'offer';if(/reject|declin/.test(s))return'rejected';if(/withdr|ghost/.test(s))return'withdrawn';if(/interview/.test(s))return'interview';if(/assess|\boa\b|test/.test(s))return'oa';if(/appl|submit/.test(s))return'applied';return'saved'}
function normDate(s){if(!s)return'';if(parse(s))return s;const d=new Date(s);return isNaN(d)?'':iso(d)}
function addIfNew(a){if(S.apps.some(x=>x.id===a.id)||findDup(a.company,a.role,a.url))return false;S.apps.push(a);return true}
function importText(txt){txt=txt.trim();if(!txt)return toast('Paste JSON or CSV first.');
  let added=0,skipped=0;
  if(/^[\[{]/.test(txt)){const raw=JSON.parse(txt);checkpoint();const d=migrate(Array.isArray(raw)?{apps:raw}:raw);
    for(const a of d.apps){a.sample=false;addIfNew(a)?added++:skipped++}
    for(const l of d.listings||[])if(!S.dismissed.includes(listingKey(l))&&!S.listings.some(x=>x.id===l.id||listingKey(x)===listingKey(l)))S.listings.push(l);
  }else{const rows=parseCSV(txt);if(rows.length<2)return toast('The CSV needs a header row and at least one row.');
    const h=rows.shift().map(x=>x.trim().toLowerCase().replace(/^﻿/,''));const col=(...n)=>h.findIndex(x=>n.includes(x));
    const ix={company:col('company','company name','name','organization'),role:col('role','position','title','job title','job'),status:col('status','stage'),location:col('location','city'),url:col('url','link','apply link','job link','posting'),deadline:col('deadline','due','due date'),applied:col('applied','date applied','applied date','applied on'),notes:col('notes','note'),track:col('track','category','type'),sponsor:col('sponsor','sponsorship','visa','visa sponsorship')};
    if(ix.company<0)return toast('The CSV needs a Company column.');
    checkpoint();
    for(const r of rows){const v=k=>ix[k]>=0?(r[ix[k]]||'').trim():'';if(!v('company'))continue;
      const st=normStatus(v('status')),role=v('role'),sp=v('sponsor').toLowerCase(),applied=normDate(v('applied'));
      const a=blankApp({company:v('company'),role,location:v('location'),url:safeUrl(v('url')),deadline:normDate(v('deadline')),applied,notes:v('notes'),
        track:TRACKS.includes(v('track').toUpperCase())?v('track').toUpperCase():inferTrack(role),sponsor:/^(y|yes|true)/.test(sp)?'yes':/^(n|no|false)/.test(sp)?'no':'unknown',
        status:st,history:[{s:'saved',d:applied||iso(TODAY)}]});
      if(st!=='saved')a.history.push({s:st,d:applied||iso(TODAY)});
      addIfNew(a)?added++:skipped++}}
  save(true);render();toast(`Imported ${added}${skipped?` · skipped ${skipped} duplicate${skipped===1?'':'s'}`:''}`,true)}
function restoreFrom(d,label){checkpoint(true);const m=migrate(d);S.apps=m.apps;S.listings=m.listings;S.dismissed=m.dismissed;S.settings=m.settings;save(true);render();toast(label,true)}

  if(fu){const a=S.apps.find(x=>x.id===fu.dataset.id);if(!a)return;checkpoint();
    if(fu.dataset.fu==='done'){logFollowUp(a,iso(TODAY));a.snoozeUntil=''}else a.snoozeUntil=rel(7);
    save();render();return toast(fu.dataset.fu==='done'?`${a.company}: follow-up logged`:`${a.company}: snoozed until ${fmt(a.snoozeUntil)}`,true)}
  const ms=t.closest('[data-missed]');
  if(ms){const a=S.apps.find(x=>x.id===ms.dataset.missed);if(!a)return;checkpoint();setStatus(a,'missed');save();render();return toast(`${a.company} moved to Closed (missed deadline)`,true)}
  const bk=t.closest('[data-bk]');
  if(bk){fetch('api/backups/'+encodeURIComponent(bk.dataset.bk),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()})
    .then(d=>restoreFrom(d,'Restored backup '+bk.closest('li').querySelector('.mono').textContent)).catch(()=>toast('That backup could not be read.'));return}
  const hd=t.closest('[data-hdel]');if(hd){const li=hd.closest('li');if(li.hasAttribute('data-s')){const rest=[...document.querySelectorAll('#hist li[data-s]')].filter(x=>!x.hidden);if(rest.length<=1)return toast('Keep at least one stage in the history.')}
    li.hidden=true;if(li.hasAttribute('data-flog')){const left=[...document.querySelectorAll('#hist li[data-flog]')].filter(x=>!x.hidden).map(x=>x.querySelector('input').value).sort();$('#f-followedUp').value=left[left.length-1]||''}return}
  const sn=t.closest('[data-snap]');if(sn){try{restoreFrom(JSON.parse(localStorage.getItem(sn.dataset.snap)),'Restored snapshot '+sn.dataset.snap.slice(-10))}catch(_){toast('That snapshot could not be read.')}return}
  const tr=t.closest('[data-trackl]');if(tr)return trackListing(tr.dataset.trackl,'saved');
  const dm=t.closest('[data-dismiss]');
  if(dm){checkpoint();const l=S.listings.find(x=>x.id===dm.dataset.dismiss);S.listings=S.listings.filter(x=>x!==l);if(l&&!S.dismissed.includes(listingKey(l)))S.dismissed.push(listingKey(l));save();render();return toast(`${l?l.company:'Listing'} dismissed`,true)}
  const th=t.closest('[data-sort]');
  if(th){const k=th.dataset.sort;S.ui.sort=S.ui.sort.key===k?{key:k,dir:-S.ui.sort.dir}:{key:k,dir:1};save();render();const b=document.querySelector(`[data-sort="${k}"]`);if(b)b.focus();return}
  const op=t.closest('[data-open]');if(op)return openDrawer(op.dataset.open);
  if(t.id==='scrim')return closeDrawer();
  if(t.closest('#addBtn'))openDrawer(null);
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='f-status'){$('#stdateWrap').hidden=t.value===origStatus;return}
  if(t.dataset.statusFor){const a=S.apps.find(x=>x.id===t.dataset.statusFor);if(!a)return;checkpoint();moveTo(a,t.value);save();render();if(t.classList.contains('move'))focusCard(a.id);return toast(`${a.company} → ${LABEL[a.status]}`,true)}
  if(t.id==='hideNo'||t.id==='p-hide'){S.settings.hideNoSponsor=t.checked;save();if(t.id==='hideNo')render();return}
  if(t.id==='lsort'){S.ui.lsort=t.value;save();return render()}
  if(t.id==='showClosed'){S.ui.showClosed=t.checked;UI.tableLimit=25;save();return render()}
  if(t.id==='p-top'||t.id==='p-min'){const top=Math.min(100,Math.max(1,+$('#p-top').value||75)),min=Math.min(top-1,Math.max(0,+$('#p-min').value||55));
    S.settings.topScore=top;S.settings.minScore=min;save();return toast(`Top matches ${top}+, lower matches below ${min}`)}
  if(t.id==='p-dgoal'){S.settings.dailyGoal=Math.min(20,Math.max(1,Math.round(+t.value||3)));save();return toast(`Daily goal: ${S.settings.dailyGoal} applications`)}
  if(t.id==='p-wgoal'){S.settings.weeklyGoal=Math.min(60,Math.max(1,Math.round(+t.value||10)));save();return toast(`Weekly goal: ${S.settings.weeklyGoal} applications`)}
  if(t.dataset.resume){S.settings.resumes=Object.assign({},DEFAULTS.resumes,S.settings.resumes,{[t.dataset.resume]:t.value.trim()||DEFAULTS.resumes[t.dataset.resume]});save();return toast('Resume version saved')}
  if(t.id==='p-stale'){S.settings.staleDays=Math.min(120,Math.max(15,Math.round(+t.value||45)));save();return toast('Saved')}
  if(t.dataset.target){const s=new Set(S.settings.targets);t.checked?s.add(t.dataset.target):s.delete(t.dataset.target);S.settings.targets=[...s];save();return toast('Target tracks saved')}
  if(t.dataset.weight){S.settings.weights[t.dataset.weight]=Math.max(0,+t.value||0);save();return toast('Weights saved')}
  if(t.id==='p-places'){S.settings.places=t.value.split(',').map(x=>x.trim()).filter(Boolean);save();return toast('Locations saved')}
  if(t.id==='p-fu'){S.settings.followUpDays=Math.min(90,Math.max(1,+t.value||14));save();return toast('Reminder saved')}
  if(t.id==='p-window'){S.settings.windowDays=Math.min(60,Math.max(1,Math.round(+t.value||10)));save();return toast('Saved. Applies from the next refresh.')}
  if(t.id==='p-hours'){S.settings.fetchHours=Math.min(24,Math.max(1,Math.round(+t.value||2)));save();return toast(`Listings will refresh every ${S.settings.fetchHours} hours`)}
  if(t.id==='fTrack'){S.ui.track=t.value;save();return render()}
  if(t.id==='fSponsor'){S.ui.sponsor=t.value;save();return render()}
});
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.ui.q=e.target.value;save();render()},150)});
document.addEventListener('submit',e=>{if(e.target.id==='appForm')submitForm(e)});
document.addEventListener('keydown',e=>{
  const open=!$('#drawer').hidden;
  if(open){if(e.key==='Escape'){e.preventDefault();return closeDrawer()}
    if(e.key==='Tab'){const f=[...$('#drawer').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
      const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    return}
  if(e.target.closest('input,textarea,select'))return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();return undo()}
  const c=e.target.closest('.card');
  if(c&&e.shiftKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const a=S.apps.find(x=>x.id===c.dataset.id);const i=FLOW.indexOf(a.status);
    if(i<0)return toast('Open the card to reopen a closed application.');
    const ni=i+(e.key==='ArrowRight'?1:-1);if(ni<0||ni>=FLOW.length)return;
    checkpoint();moveTo(a,FLOW[ni]);save();render();focusCard(a.id);return toast(`${a.company} → ${LABEL[a.status]}`,true)}
  if(e.key==='Enter'||e.key===' '){const o=e.target.closest('li[data-open]');if(o){e.preventDefault();return openDrawer(o.dataset.open)}}
  if((e.key==='n'||e.key==='N')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();return openDrawer(null)}
  if(e.key==='/'&&!$('#tools').hidden){e.preventDefault();$('#q').focus()}
});
/* drag and drop (pointer); keyboard and touch use Shift+arrows or the stage menu */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('.card');if(c)c.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();
  const a=S.apps.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(!a)return;
  const st=col.dataset.drop==='closed'?(CLOSED.includes(a.status)?a.status:'rejected'):col.dataset.drop;
  if(st===a.status)return render();checkpoint();moveTo(a,st);save();render();toast(`${a.company} → ${LABEL[a.status]}`,true)});
window.addEventListener('hashchange',()=>{closeDrawer();render()});
function tick(){const n=new Date();n.setHours(0,0,0,0);if(+n!==+TODAY){TODAY=n;takeDailySnapshot();if($('#drawer').hidden)render()}}
setInterval(tick,60000);setInterval(()=>{if(!document.hidden)checkRemote()},90000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();checkRemote()}});
function applyTheme(m){const r=document.documentElement;if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme');
  const b=$('#themeBtn');if(b)b.textContent='Theme: '+(m==='light'?'Light':m==='dark'?'Dark':'System')}

/* ---------- boot ---------- */
(async()=>{
  const d=await Store.init();
  S=d?migrate(d):fresh();
  takeDailySnapshot();
  $('#fTrack').insertAdjacentHTML('beforeend',TRACKS.map(t=>`<option value="${t}">${t} · ${TRACK_NAME[t]}</option>`).join(''));
  S.ui.q='';$('#fTrack').value=S.ui.track||'';$('#fSponsor').value=S.ui.sponsor||'';$('#q').value='';
  if(Store.mode==='file'){$('#themeBtn').hidden=false;let m='system';try{m=localStorage.getItem('iat-theme')||'system'}catch(_){}applyTheme(m)}
  render();
  setSaved(Store.mode==='file'?'Saved to data/tracker.json':'Saved in this browser only',Store.mode!=='file');
  if(Store.mode==='file')save();
})();
})();
</script>
